<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="add-count.css">
    <link rel="stylesheet" href="../../shared-modules/general.css">

    <link
        rel="icon"
        href="https://raw.githubusercontent.com/DrHavran/Zemeraj-adminer/refs/heads/main/logo.png"
        type="image/x-icon"
    >

    <title>Add count</title>
</head>

<body>
    <div id="header"></div>

    <main>
        <h2>Nová inventura</h2>

        <input
            type="search"
            id="search"
            placeholder="Hledat položku..."
            autocomplete="off"
        >

        <div id="search-results"></div>

        <h3 class="hidden">Počítané položky</h3>

        <div id="selected-header" class="hidden">
            <span></span>
            <span>Položka</span>
            <span>Počet</span>
            <span></span>
        </div>

        <div id="selected-items"></div>

        <button id="save-count" class="hidden">Uložit inventuru</button>

        <p id="message"></p>
    </main>

    <div id="footer"></div>

    <script src="../../shared-modules/footer.js"></script>
    <script type="module" src="../../shared-modules/header.js"></script>
    <script type="module" src="add-count.js"></script>

</body>
</html>
